<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Bootstrap Project-2</title>
</head>
<body>
    <div class="container">
        <header class="text-bg-primary text-center p-4 m-3">
            <h1 class="display-4">SuperShoes</h1>
            <p class="lead">Light, strong and ready for every road.</p>
        </header>
        <main class="px-5 pt-5 pb-0 text-center">
            <div class="row mb-5">
                <div class="col-md-4">
                    <p class="h5 bg-success p-5 text-white rounded"><strong>Fast</strong></p>
                    <h2 class="h4">Fast</h2>
                    <p>Built for speed on any track.</p>
                </div>
                <div class="col-md-4">
                    <p class="h5 bg-danger p-5 text-white rounded"><strong>Responsive</strong></p>
                    <h2 class="h4">Comfortable</h2>
                    <p>Soft sole you can wear all day.</p>
                </div>
                <div class="col-md-4">
                    <p class="h5 bg-info p-5 text-white rounded"><strong>Easy</strong></p>
                    <h2 class="h4">Affordable</h2>
                    <p>Great quality at a fair price.</p>
                </div>
            </div>
            <div class="p-4 bg-dark rounded text-white">
                <h2 class="h4">Buy now and get 20% off</h2>
                <p class="lead">Offer ends this Friday.</p>
            </div>
        </main>
        <footer class="text-center text-muted mt-3 mb-3">
            <small>&copy; 2026 SuperShoes</small>
        </footer>
    </div>
</body>
</html>
